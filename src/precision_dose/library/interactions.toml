# Curated perpetrator library for drug-drug interactions.
#
# Every Ki, kinact, kdeg, Emax or fold-change here is a literature value with a
# source and a confidence label. The curator validates these; the engine applies
# them through the substrate's fraction-metabolised table, so an inhibitor of a
# pathway the drug does not use has no effect and says so in the output.

[perpetrators.fluconazole]
classes = ["moderate_cyp3a4_inhibitor", "moderate_cyp2c9_inhibitor"]
confidence = "moderate"
source = "S1"

[perpetrators.fluconazole.effects.CYP3A4]
mechanism = "empirical_fold"
cl_fold = 0.38
note = "Measured in vivo: tacrolimus clearance fell from 38.8 to 14.7 L/h when fluconazole was added in renal transplant recipients (S1b), a fold of 0.38. An in-vitro Ki (9.2 umol/L for cDNA-expressed CYP3A4, Gibbs 1999) combined with systemic unbound Cmax (~38 umol/L) predicts 0.18, i.e. much stronger inhibition than is observed: systemic unbound concentration overstates the hepatic concentration available to the enzyme. The measured fold is used, and it applies to total clearance rather than through fm."

[perpetrators.fluconazole.effects.CYP2C9]
mechanism = "competitive"
ki_umol_L = 20.0
note = "Fluconazole is a moderate CYP2C9 inhibitor (warfarin, phenytoin interactions)."

[perpetrator_pk.fluconazole]
v_l_per_kg = 0.70
cl_l_h = 1.50
f = 0.90
fu = 0.89
mw_g_per_mol = 306.27
source = "S1"

[perpetrators.ketoconazole]
classes = ["strong_dual_cyp3a4_pgp_inhibitor"]
confidence = "high"
source = "S2"

[perpetrators.ketoconazole.effects.CYP3A4]
mechanism = "competitive"
ki_umol_L = 0.05
note = "Potent azole inhibition; unbound concentrations exceed Ki by more than an order of magnitude, so the multiplier is near its floor."

[perpetrator_pk.ketoconazole]
v_l_per_kg = 0.60
cl_l_h = 12.0
f = 0.75
fu = 0.01
mw_g_per_mol = 531.43
source = "S2"
note = "Highly protein bound, so the unbound concentration is low despite a high total Cmax; this is why a potent Ki does not produce complete inhibition."

[perpetrators.rifampicin]
classes = ["strong_dual_cyp3a4_pgp_inducer"]
confidence = "moderate"
source = "S3"

[perpetrators.rifampicin.effects.CYP3A4]
mechanism = "induction"
emax = 3.0
ec50_umol_L = 1.0
note = "Rifampicin induces CYP3A4 and P-gp; Emax is a fold-change on intrinsic clearance, not a multiplier on total CL."

[perpetrator_pk.rifampicin]
v_l_per_kg = 1.00
cl_l_h = 10.0
f = 0.95
fu = 0.20
mw_g_per_mol = 822.94
source = "S3"

[perpetrators.omeprazole]
classes = ["cyp2c19_inhibitor"]
confidence = "moderate"
source = "S4"

[perpetrators.omeprazole.effects.CYP2C19]
mechanism = "competitive"
ki_umol_L = 5.0
note = "Omeprazole is a competitive CYP2C19 inhibitor; the clinical effect depends heavily on CYP2C19 genotype."

[perpetrator_pk.omeprazole]
v_l_per_kg = 0.35
cl_l_h = 20.0
f = 0.60
fu = 0.05
mw_g_per_mol = 345.42
source = "S4"

[perpetrators.amiodarone]
classes = ["pgp_inhibitor", "cyp3a4_inhibitor"]
confidence = "high"
source = "S5"

[perpetrators.amiodarone.effects.PGP]
mechanism = "empirical_fold"
cl_fold = 0.50
note = "Serum digoxin roughly doubled at an unchanged dose (mean 0.97 -> 1.98 ng/mL, +104%) after 1-3 weeks of amiodarone 1.25 g/day in 28 patients (S5). A doubling of concentration at constant dose is a halving of clearance, hence 0.50. Amiodarone and desethylamiodarone inhibit P-gp in the gut, biliary canaliculus and renal tubule, so the effect is on both the renal and non-renal components."

[perpetrators.amiodarone.effects.CYP3A4]
mechanism = "competitive"
ki_umol_L = 0.05
note = "Amiodarone is a CYP3A4 inhibitor; this matters for tacrolimus and other 3A4 substrates, not for digoxin, which is not metabolised. Present so that the drug is not silently unhandled."

[perpetrator_pk.amiodarone]
v_l_per_kg = 60.0
cl_l_h = 1.90
f = 0.50
fu = 0.04
mw_g_per_mol = 645.31
source = "S5"

[citations.S5]
ref = "Moysey JO, Jaggarao NS, Grundy EN, Chamberlain DA. Amiodarone increases plasma digoxin concentrations. Br Med J (Clin Res Ed). 1981;282(6260):272."
doi = "10.1136/bmj.282.6260.272"
note = "28 patients; mean serum digoxin rose from 0.97 to 1.98 ng/mL (+104%) on unchanged digoxin after 1-3 weeks of amiodarone."

[citations.S1b]
ref = "Ikeda Y, et al. Pharmacokinetic study of the combination of tacrolimus and fluconazole in renal transplant patients. (PubMed 17044457)."
doi = ""
note = "Tacrolimus CL/F 38.79 L/h before vs 14.74 L/h after fluconazole (p = 0.001); oral bioavailability roughly doubled. The measured clearance ratio 0.38 is used directly."

